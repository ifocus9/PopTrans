name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test-and-build:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Build frontend assets
        shell: pwsh
        run: |
          Push-Location frontend
          try {
            npm ci
            npm run build
          } finally {
            Pop-Location
          }

      - name: Restore cached llama-cpp-python wheelhouse
        id: llama-wheel-cache
        uses: actions/cache@v4
        with:
          path: .wheelhouse
          key: llama-wheel-${{ runner.os }}-py312-cpu-${{ hashFiles('backend/requirements.txt', 'backend/requirements-build.txt', 'scripts/prepare_llama_wheel.ps1') }}
          restore-keys: |
            llama-wheel-${{ runner.os }}-py312-cpu-

      - name: Install Python dependencies (using precompiled wheel)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          & .\scripts\prepare_llama_wheel.ps1 -WheelDir ".wheelhouse" -Variant "cpu" -ReleaseTag "llama-wheels-py312" -TryUpstreamBinary -Install
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Python backend tests
        shell: pwsh
        run: |
          python -m unittest discover -s backend -p "test_*.py" -v

      - name: Run Go tests and verify build
        shell: pwsh
        run: |
          go test -count=1 ./...
          go build ./...
