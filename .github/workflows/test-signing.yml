name: SignPath Test Signing

on:
  workflow_dispatch: # 支持在 GitHub 页面上手动一键触发

jobs:
  test-sign:
    name: Build and Test Sign
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build executable
        run: |
          mkdir -p build-output
          go build -ldflags "-s -w -H windowsgui" -o build-output/PopTrans.exe ./cmd/translate-go

      - name: Upload unsigned artifact to GitHub
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-artifacts
          path: build-output/PopTrans.exe

      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'poptrans'
          signing-policy-slug: 'test-signing'
          artifact-configuration-slug: 'initial'
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed-artifacts'

      - name: Verify signed artifact
        shell: pwsh
        run: |
          Write-Host "Listing signed artifacts:"
          Get-ChildItem -Path signed-artifacts -Recurse
          
          # 检查签名产物（如果下载下来是 zip 则解压，否则直接检查 exe）
          $signedExe = Get-ChildItem -Path signed-artifacts -Filter "PopTrans.exe" -Recurse | Select-Object -First 1
          if (-not $signedExe) {
            $zipFile = Get-ChildItem -Path signed-artifacts -Filter "*.zip" -Recurse | Select-Object -First 1
            if ($zipFile) {
              Expand-Archive -Path $zipFile.FullName -DestinationPath signed-output -Force
              $signedExe = Get-ChildItem -Path signed-output -Filter "PopTrans.exe" -Recurse | Select-Object -First 1
            }
          }
          
          if ($signedExe) {
            $sig = Get-AuthenticodeSignature -FilePath $signedExe.FullName
            Write-Host "Authenticode Signature Status: $($sig.Status)"
            Write-Host "Signer Certificate Subject: $($sig.SignerCertificate.Subject)"
            Write-Host "✅ Test signing verified successfully!"
          } else {
            Write-Error "Could not find signed PopTrans.exe in output."
          }
